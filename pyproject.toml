[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mooc-dropout"
version = "0.1.0"
description = "基于代价敏感 CatBoost 的 MOOC 辍学风险预测"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "廖祥鳌" }]
keywords = ["mooc", "dropout-prediction", "catboost", "cost-sensitive", "fastapi"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

# 静态资源必须随包分发：少了 static/，pip 安装后 /docs 与演示页都会 404，
# 而源码树里跑 demo.py 却看不出问题（它走的是仓库内路径）。这一条别删。
[tool.setuptools.package-data]
mooc_dropout = [
    "api/static/*.html",
    "api/static/*.css",
    "api/static/*.js",
    "api/static/vendor/*",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]
markers = [
    "slow: 需要真实训练的较慢用例",
    "catboost: 仅在 catboost 可用时执行",
]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["_scratch", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE"]
ignore = [
    "E501", # 注释多为中文，按字符计长会系统性误报；行长靠 review 把关
    "B008", # FastAPI 的 Depends()/Security() 就写在默认参数位置，属框架约定
    "B905", # zip(strict=) 需逐处判断语义，统一加 strict=False 只会制造噪音
]

[tool.ruff.lint.isort]
known-first-party = ["mooc_dropout"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
files = ["src"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = false
